name: fiscalia
description: "FiscalIA - Simulateur & Optimisateur d'Impôts sur le Revenu — France"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.69.0
  intl: ^0.19.0
  pdf: ^3.11.1
  share_plus: ^10.1.4
  go_router: ^14.8.1
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  assets:
    - assets/knowledge/
    - assets/images/
