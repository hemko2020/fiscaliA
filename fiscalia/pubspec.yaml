name: fiscalia
description: "FiscalIA - Simulateur & Optimisateur d'Impôts sur le Revenu — France"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.69.0
  intl: ^0.19.0
  pdf: ^3.11.1
  share_plus: ^10.1.4
  go_router: ^14.8.1
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  uuid: ^4.5.3
  file_picker: ^11.0.2
  image_picker: ^1.2.2
  google_mlkit_text_recognition:
    path: packages/google_mlkit_text_recognition
  syncfusion_flutter_pdf: ^33.2.4
  firebase_core: ^4.7.0
  cloud_functions: ^6.2.0
  google_mobile_ads: ^9.2.0
  purchases_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4

dependency_overrides:
  google_mlkit_commons:
    path: packages/google_mlkit_commons

flutter:
  uses-material-design: true
  assets:
    - assets/knowledge/
    - assets/images/
